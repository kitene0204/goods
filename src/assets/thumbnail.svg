<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E13" />
      <stop offset="50%" stop-color="#0F2D1F" />
      <stop offset="100%" stop-color="#040D08" />
    </linearGradient>
    
    <!-- Court Grid Pattern -->
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <!-- Tennis Ball Gradient -->
    <radialGradient id="tennisBallGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="45%" stop-color="#CCFF00" />
      <stop offset="85%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </radialGradient>

    <!-- Glowing Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <!-- Zap / Cloud Lightning Gradient -->
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="ballGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#CCFF00" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="checkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#22C55E" flood-opacity="0.8" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base Canvas (1024x1024) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- Tennis Court Geometric Lines in Background -->
  <g opacity="0.4" transform="translate(112, 112)">
    <!-- Outer Court Box -->
    <rect x="0" y="0" width="800" height="800" rx="160" fill="url(#courtGrad)" stroke="#A7F3D0" stroke-width="4" stroke-opacity="0.3" />
    <!-- Service Court Box -->
    <rect x="120" y="120" width="560" height="560" rx="80" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-dasharray="12 8" stroke-opacity="0.25" />
    <!-- Center Court Net Line -->
    <line x1="0" y1="400" x2="800" y2="400" stroke="#CCFF00" stroke-width="3" stroke-opacity="0.4" />
    <line x1="400" y1="120" x2="400" y2="680" stroke="#CCFF00" stroke-width="3" stroke-opacity="0.4" />
  </g>

  <!-- Ambient Radial Glow Circles -->
  <circle cx="512" cy="460" r="320" fill="#CCFF00" opacity="0.08" filter="blur(60px)" />
  <circle cx="680" cy="340" r="200" fill="#38BDF8" opacity="0.1" filter="blur(50px)" />

  <!-- Main Central Visual: Isometric 3D Tennis Ball -->
  <g filter="url(#ballGlow)">
    <!-- Tennis Ball Circle -->
    <circle cx="512" cy="450" r="210" fill="url(#tennisBallGrad)" />

    <!-- Tennis Ball White Seams -->
    <!-- Seam 1 (Left Curve) -->
    <path d="M 360 290 C 440 370, 440 530, 360 610" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.9" />
    <!-- Seam 2 (Right Curve) -->
    <path d="M 664 290 C 584 370, 584 530, 664 610" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.9" />

    <!-- Ball Top Surface Sheen -->
    <ellipse cx="440" cy="340" rx="90" ry="55" fill="#FFFFFF" opacity="0.25" transform="rotate(-25 440 340)" />
  </g>

  <!-- High-Impact Glowing Checkmark in Center -->
  <g filter="url(#checkGlow)" transform="translate(512, 450)">
    <!-- Outer Floating Check Badge -->
    <circle cx="0" cy="0" r="115" fill="#042F1A" stroke="#4ADE80" stroke-width="8" />
    <!-- Checkmark Path -->
    <path d="M -50 0 L -15 36 L 52 -38" fill="none" stroke="url(#checkGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top-Right: 0.1s Real-time Cloud Sync Badge -->
  <g filter="url(#badgeGlow)" transform="translate(690, 240)">
    <rect x="-100" y="-36" width="200" height="72" rx="36" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    <!-- Mini Lightning Zap Icon -->
    <path d="M -60 -12 L -45 -12 L -52 4 L -38 4 L -56 22 L -50 8 L -62 8 Z" fill="#38BDF8" />
    <text x="-25" y="10" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="900" fill="#F0F9FF" letter-spacing="0.5">0.1s LIVE</text>
  </g>

  <!-- Top-Left: Multi-Court / All-in-One Pill -->
  <g transform="translate(320, 240)">
    <rect x="-95" y="-36" width="190" height="72" rx="36" fill="#064E3B" stroke="#34D399" stroke-width="3" opacity="0.95" />
    <circle cx="-52" cy="0" r="10" fill="#34D399" />
    <text x="-28" y="9" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800" fill="#ECFDF5">전체동기화</text>
  </g>

  <!-- Bottom App Title Typography Card -->
  <g transform="translate(512, 790)" filter="url(#cardShadow)">
    <!-- Backdrop Pill -->
    <rect x="-380" y="-80" width="760" height="160" rx="50" fill="#0B1320" stroke="#334155" stroke-width="3" />

    <!-- Main Title -->
    <text x="0" y="-12" font-family="'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
      한울림 테니스 스마트 체크인
    </text>

    <!-- Subtitle: Features List -->
    <text x="0" y="40" font-family="'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#A3E635" text-anchor="middle" letter-spacing="1">
      ⚡ 실시간 클라우드 DB  •  📊 구글 시트 연동  •  🎁 경품 추첨
    </text>
  </g>
</svg>
