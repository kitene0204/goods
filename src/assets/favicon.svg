<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#CCFF00" />
      <stop offset="75%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </radialGradient>

    <!-- Dark Center Badge -->
    <radialGradient id="badgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </radialGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <!-- Drop Shadows for Small Scale Clarity -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Tennis Ball -->
  <circle cx="32" cy="32" r="30" fill="url(#ballGrad)" filter="url(#shadow)" />

  <!-- Tennis Ball Seams -->
  <!-- Left Seam -->
  <path d="M 12 14 C 22 24, 22 40, 12 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <!-- Right Seam -->
  <path d="M 52 14 C 42 24, 42 40, 52 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- High-Contrast Floating Check Badge in Center -->
  <circle cx="32" cy="32" r="16" fill="url(#badgeGrad)" stroke="#4ADE80" stroke-width="2" filter="url(#shadow)" />

  <!-- Crisp Glowing Checkmark -->
  <path d="M 24 32 L 30 38 L 40 25" fill="none" stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
